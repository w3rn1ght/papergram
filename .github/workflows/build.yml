name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".editorconfig"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos
  TDLIB_ROOT: ${{ github.workspace }}/.tdlib
  TDLIB_VERSION: v1.8.0
  OPENSSL_VERSION: OpenSSL_1_1_1w
  IOS_MIN: "12.0"

jobs:
  build:
    name: Build package
    runs-on: macos-14
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          brew install cmake gperf ldid dpkg xz

      - name: Restore TDLib cache
        id: tdlib-cache
        uses: actions/cache@v4
        with:
          path: .tdlib
          key: tdlib-${{ env.TDLIB_VERSION }}-${{ env.OPENSSL_VERSION }}-ios${{ env.IOS_MIN }}-arm64-${{ hashFiles('scripts/build-tdlib.sh') }}

      - name: Build TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          bash scripts/build-tdlib.sh

      - name: Inject API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          set -euo pipefail
          python3 scripts/make_secrets.py

      - name: Install Theos
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Build application
        run: |
          set -euo pipefail
          chmod +x layout/DEBIAN/postinst
          make clean || true
          make package FINALPACKAGE=1 TDLIB_ROOT="$TDLIB_ROOT"

      - name: Verify package
        run: |
          set -euo pipefail
          APP=".theos/_/Applications/Papergram.app"
          test -d "$APP"
          test -f "$APP/Papergram"
          test -f "$APP/Info.plist"
          test -f "$APP/Icon-76@2x.png"
          lipo -info "$APP/Papergram"
          lipo -info "$APP/Papergram" | grep -q arm64
          du -sh "$APP"
          ls -la packages

      - name: Create unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R .theos/_/Applications/Papergram.app build/Payload/
          cd build
          zip -qry Papergram-unsigned.ipa Payload

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Papergram-packages
          path: |
            packages/*.deb
            build/Papergram-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            packages/*.deb \
            build/Papergram-unsigned.ipa \
            --title "Papergram $GITHUB_REF_NAME" \
            --generate-notes
